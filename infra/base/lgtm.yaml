# Grafana + Tempo + Loki + Prometheus + OTel collector in one container (local only).
apiVersion: v1
kind: Service
metadata:
  name: otel
spec:
  selector: { app: lgtm }
  ports:
    - { name: grafana, port: 3000 }
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  selector:
    matchLabels: { app: lgtm }
  template:
    metadata:
      labels: { app: lgtm }
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.38.0
          ports: [{ containerPort: 3000 }, { containerPort: 4317 }, { containerPort: 4318 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
