apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector: { app: kafka-ui }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  selector:
    matchLabels: { app: kafka-ui }
  template:
    metadata:
      labels: { app: kafka-ui }
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KAFKA_CLUSTERS_0_NAME, value: shopwise }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "shopwise-kafka-bootstrap:9092" }
            - { name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY, value: "http://apicurio:8080/apis/ccompat/v7" }
            - { name: DYNAMIC_CONFIG_ENABLED, value: "false" }
