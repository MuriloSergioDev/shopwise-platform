# Reusable: release-please on main. Outputs whether a release was cut so callers can dispatch to consumers.
name: release
on:
  workflow_call:
    inputs:
      release-type: { type: string, default: simple }
    outputs:
      released: { value: "${{ jobs.release.outputs.released }}" }
      tag: { value: "${{ jobs.release.outputs.tag }}" }

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          release-type: ${{ inputs.release-type }}
