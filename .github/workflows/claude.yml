# Reusable: Claude Code on @claude mentions and automatic PR review. Needs ANTHROPIC_API_KEY secret.
name: claude
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY: { required: true }

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event_name == 'pull_request' && 'Review this PR. Follow AGENTS.md and the shopwise plugin conventions (boundaries, outbox, money, tests). Post concise inline comments only for real problems.' || '' }}
