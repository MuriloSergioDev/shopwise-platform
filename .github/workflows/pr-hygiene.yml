# Reusable: PR title must be a Conventional Commit (squash merges use it as the commit message).
name: pr-hygiene
on:
  workflow_call:

jobs:
  title:
    runs-on: ubuntu-latest
    permissions: { pull-requests: read }
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
