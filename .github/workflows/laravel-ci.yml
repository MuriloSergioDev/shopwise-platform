# Reusable CI for Shopwise Laravel repos (services and laravel-kit).
# Caller: jobs.ci.uses: MuriloSergioDev/shopwise-platform/.github/workflows/laravel-ci.yml@main
name: laravel-ci
on:
  workflow_call:
    inputs:
      php-version: { type: string, default: "8.5" }
      build-image: { type: boolean, default: true }

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pdo_pgsql, rdkafka, intl, bcmath, pcntl
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
        if: hashFiles('artisan') != ''
      - name: Pint
        run: vendor/bin/pint --test
      - name: Rector
        run: vendor/bin/rector --dry-run
      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - name: Pest
        run: vendor/bin/pest --parallel

  image:
    if: inputs.build-image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
